name: bolitero_cubano
description: "Aplicación 100% libre, offline-first y sin publicidad de La Bolita Cubana y Loterías"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Persistencia y Caché Local
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Red Ligera & CDN Delta Sync
  http: ^1.2.2

  # Gestión de Estado & Enrutamiento
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Supabase (Sincronización en la Nube y Encuestas)
  supabase_flutter: ^2.6.0

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/bolitero_seed.db
    - assets/seed/charada_seed.json
