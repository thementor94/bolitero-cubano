name: Compilar APK Android Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Re-generar proyecto Android oficial
        run: |
          mkdir ../temp_bolitero && cd ../temp_bolitero
          flutter create --org com.bolitero.libre --project-name bolitero_cubano .
          cp -r android $GITHUB_WORKSPACE/

      - name: Configurar SDK versions y compatibilidad de plugins
        run: |
          # 1. Configurar app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34\n    compileSdkVersion = 34/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true

          # 2. Inyectar configuración obligatoria a subproyectos (fix app_links compileSdkVersion null)
          cat << 'EOF' >> android/build.gradle

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdkVersion 34
                buildToolsVersion "34.0.0"
            }
        }
    }
}
EOF
          echo "=== android/build.gradle ==="
          tail -n 20 android/build.gradle
          echo "=== android/app/build.gradle ==="
          grep -E "compileSdk|minSdk|targetSdk" android/app/build.gradle

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK Release
        run: flutter build apk --release

      - name: Subir artefacto APK Release
        uses: actions/upload-artifact@v4
        with:
          name: bolitero-cubano-apk
          path: build/app/outputs/flutter-apk/*.apk
