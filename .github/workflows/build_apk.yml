name: Compilar APK Android Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Re-generar proyecto Android oficial
        run: |
          mkdir ../temp_bolitero && cd ../temp_bolitero
          flutter create --org com.bolitero.libre --project-name bolitero_cubano .
          cp -r android $GITHUB_WORKSPACE/

      - name: Configurar minSdkVersion y dependencias nativas
        run: |
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK capturando excepciones
        run: |
          flutter build apk --debug --verbose 2>&1 | tee build.log | grep -E "Error:|Exception:|FAILURE|BUILD FAILED" -A 10 || true

      - name: Subir log como release note
        if: failure()
        run: |
          echo "=== TAIL DEL LOG DE ERROR ==="
          tail -n 100 build.log
