name: Compilar APK Android Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Ejecutar pruebas unitarias
        run: flutter test test/unit/

      - name: Compilar APK Release
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Subir artefacto APK Release
        uses: actions/upload-artifact@v4
        with:
          name: bolitero-cubano-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publicar Release Oficial en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Bolitero Libre v1.1.0 (Órganos Funcionales Vivos)"
          body: |
            ### 🎲 Bolitero Libre v1.1.0 - Totalmente Funcional
            * **100% Gratuito y Libre**: Sin anuncios, sin compras integradas, sin rastreadores.
            * **Órganos Vivos Pantalla por Pantalla**: Implementación completa de los 17 diseños de Stitch.
            * **Historial Completo de 180 Días**: Base SQLite pre-sembrada con 900 sorteos oficiales e índices analíticos de alto rendimiento.
            * **Charada Tradicional y Mística**: 100 términos canónicos, sinónimos, deidades sincréticas y números acompañantes (jaladeras).
            * **Estadísticas Analíticas**: Top 10 Calientes, Top 10 Atrasados y Cartón Mensual Heatmap 10x10.
            * **Suite de Cálculo de 7 Herramientas**: Pirámide Pascal mod 10 con inyección rápida, Cruz 3x3 Tradicional, Equivalencias (+25, -25, espejo, inverso), Candados/Parlés, Reducciones por decenas/terminales/paridad, Tabla de los Dioses y Horóscopo determinista.
            * **Mi Laboratorio y Comprobante Digital**: Simulador financiero con liquidación automática y ticket voucher compartible por WhatsApp/Telegram.
            * **Encuesta Comunitaria y Ajustes**: Termómetro popular offline-resilient y configuración regional de Parlé (Habana 900x vs Oriente 1000x).
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
