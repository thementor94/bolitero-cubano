name: Compilar APK Android Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK Release por Arquitectura (Optimizado para Cuba)
        run: flutter build apk --split-per-abi --release

      - name: Subir artefactos de APK (armeabi-v7a y arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: bolitero-cubano-apk
          path: build/app/outputs/flutter-apk/*.apk
