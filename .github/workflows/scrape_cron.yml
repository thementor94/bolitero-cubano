name: Ingesta Oficial de Sorteos (Florida, GA, NY)

on:
  schedule:
    # Ventana Mediodía EST: 1:32 PM, 1:45 PM, 1:55 PM (18:32, 18:45, 18:55 UTC)
    - cron: '32,45,55 18 * * *'
    # Ventana Noche EST: 9:47 PM, 9:55 PM, 10:10 PM (02:47, 02:55, 03:10 UTC)
    - cron: '47,55 2 * * *'
    - cron: '10 3 * * *'
  workflow_dispatch:

jobs:
  scrape_and_publish:
    name: Extraer Sorteos y Actualizar CDN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar script de ingesta
        run: python scraper/scrape_lottery.py

      - name: Desplegar latest.json a GitHub Pages / CDN
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
