name: Ingesta Oficial de Sorteos (Florida, GA, NY)

on:
  schedule:
    # 1:31 PM EST (18:31 UTC) y 9:46 PM EST (02:46 UTC)
    - cron: '31 18 * * *'
    - cron: '46 2 * * *'
  workflow_dispatch:

jobs:
  scrape_and_publish:
    name: Extraer Sorteos y Actualizar CDN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar script de ingesta
        run: python scraper/scrape_lottery.py

      - name: Desplegar latest.json a GitHub Pages / CDN
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
